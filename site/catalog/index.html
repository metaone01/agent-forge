<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="agent-forge-api-base" content="../api/v1/">
    <meta name="description" content="Agent Forge 元数据目录" data-i18n-content="Agent Forge metadata catalog">
    <title data-i18n="Agent Forge · 元数据目录">Agent Forge · 元数据目录</title>
    <script src="../assets/preferences.js"></script>
    <link rel="stylesheet" href="../assets/styles.css">
    <link rel="stylesheet" href="../assets/api-catalog.css">
  </head>
  <body data-page="api-catalog">
    <header class="topbar">
      <a class="brand" href="../">Agent Forge <span data-i18n="METADATA CATALOG">元数据目录</span></a>
      <nav class="topnav" aria-label="主导航" data-i18n-aria-label="nav.label">
        <a href="#/recommendations" data-i18n="rec.browse">浏览精选来源</a>
        <a href="dashboard/" data-i18n="nav.dashboard">数据总览</a>
        <a href="../docs/" data-doc-entry data-i18n="nav.docs">文档</a>
        <a class="button button-small" href="../submit/" data-i18n="nav.submit">上传包</a>
      </nav>
    </header>

    <section id="source-control-panel" class="shell collection-controls-shell" aria-label="采集控制记录" data-i18n-aria-label="ctrl.title" hidden></section>
    <main class="shell">
      <section class="hero">
        <div>
          <p class="eyebrow" data-i18n="READ-ONLY METADATA INDEX">只读元数据索引</p>
          <h1 data-i18n="为 Agent 找到合适的工具。">为 Agent 找到合适的工具。</h1>
          <p class="lede" data-i18n="api.description">按 Agent、类型、标签和来源指标查询公开元数据。包提供安装地址，目录不代理插件文件。</p>
        </div>
        <div class="hero-stamp" id="revision-stamp" data-i18n="正在读取索引…">正在读取索引…</div>
      </section>

      <section class="search-panel" aria-label="搜索和筛选" data-i18n-aria-label="搜索和筛选">
        <label class="search-box">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="query" type="search" placeholder="搜索名称、描述、关键词或标签" data-i18n-placeholder="搜索名称、描述、关键词或 facet" autocomplete="off">
          <kbd>/</kbd>
        </label>
        <div class="filters">
          <label><span data-i18n="api.scope">查询范围</span><select id="scope-filter"><option value="catalog" data-i18n="api.scope.catalog">已收录目录</option><option value="discovery" data-i18n="api.scope.discovery">发现候选</option></select></label>
          <label>Agent<select id="agent-filter"><option value="" data-i18n="全部 Agent">全部 Agent</option></select></label>
          <label><span data-i18n="类型">类型</span><select id="type-filter"><option value="" data-i18n="全部类型">全部类型</option><option value="mcp">MCP</option><option value="plugin" data-i18n="Plugin">插件</option><option value="skill" data-i18n="Skill">技能</option><option value="general" data-i18n="General">通用</option><option value="bundle" data-i18n="Bundle">组合包</option></select></label>
          <label><span data-i18n="Subtype">子类型</span><select id="subtype-filter"><option value="" data-i18n="全部 subtype">全部子类型</option></select></label>
          <label class="review-filter-control" hidden><span data-i18n="review.filter">元数据分拣状态</span><select id="review-disposition-filter"><option value="" data-i18n="review.all">全部记录</option><option value="not_recorded" data-i18n="review.not_recorded">未记录</option><option value="needs_metadata" data-i18n="review.needs_metadata">运行者要求补充元数据</option><option value="rejected" data-i18n="review.rejected">运行者拒绝收录</option><option value="unsupported" data-i18n="review.unsupported">当前目录不支持</option><option value="pending" data-i18n="review.pending">重新待审</option><option value="superseded" data-i18n="review.superseded">元数据已变化，旧记录待重审</option></select></label>
          <label class="source-filter-control"><span data-i18n="sourceFilter.label">精选来源关联</span><select id="recommendation-source-filter"><option value="" data-i18n="sourceFilter.all">不按来源筛选</option></select></label>
          <label class="facet-control"><span data-i18n="api.tags">标签筛选（可多选）</span><select id="facet-filter" multiple size="4" aria-label="标签筛选" data-i18n-aria-label="api.tags"></select></label>
          <button class="button button-quiet" id="clear-filters" type="button" data-i18n="清除筛选">清除筛选</button>
        </div>
      </section>

      <p id="review-filter-status" class="muted" role="status"></p>
      <p id="scope-notice" class="scope-notice" role="status" hidden></p>
      <p id="filter-status" class="muted" role="status"></p>
      <button id="retry-filter-options" class="button button-quiet" type="button" data-i18n="api.retry" hidden>重试</button>

      <div class="source-filter-actions">
        <p id="source-filter-status" class="muted" role="status"></p>
        <button id="retry-source-options" class="button button-quiet" type="button" data-i18n="api.retry" hidden>重试</button>
        <button id="more-source-options" class="button button-quiet" type="button" data-i18n="sourceFilter.more" hidden>加载更多来源</button>
      </div>
      <p id="source-match-notice" class="scope-notice" role="status" hidden></p>
      <section class="catalog-toolbar">
        <div><span id="result-scope" class="pill"></span> <strong id="result-count">0</strong> <span data-i18n="api.loadedLabel">本页记录</span> <span id="catalog-status" class="muted" data-i18n="正在加载…">正在加载…</span></div>
        <label class="sort-control"><span data-i18n="排序">排序</span><select id="sort-select"><option value="canonical_updated" data-i18n="api.sort.canonical">最近规范更新</option><option value="first_seen" data-i18n="api.sort.discovered">最近收录</option><option value="stars" data-i18n="api.sort.stars">所属仓库 Star</option><option value="star_growth" data-i18n="api.sort.starGrowth">Star 增长热门</option><option value="downloads" data-i18n="api.sort.downloads">npm 下载最多</option><option value="download_growth" data-i18n="api.sort.downloadGrowth">npm 下载热门</option><option value="latest_release" data-i18n="api.sort.release">最新声明发行</option><option value="repo_pushed" data-i18n="api.sort.pushed">最近代码推送</option><option value="relevance" data-i18n="相关性">相关性</option><option value="name" data-i18n="名称">名称</option></select></label>
      </section>
      <p id="ranking-context" class="muted"></p>
      <p id="coverage-status" class="muted" role="status"></p>
      <p id="metric-notice" class="muted" data-i18n="api.coverage">下载次数不是人数；仓库 Star 可能由多个插件共享。</p>
      <button class="button button-quiet" id="refresh-query" type="button" data-i18n="api.refresh">读取最新目录</button>
      <div id="query-error" class="api-error" role="alert" hidden><p id="query-error-message"></p><button id="retry-query" class="button" type="button" data-i18n="api.retry">重试</button></div>
      <section id="results" class="result-list" aria-live="polite"></section>
      <nav id="pagination" class="pagination" aria-label="结果分页" data-i18n-aria-label="结果分页" hidden>
        <span id="page-range" class="page-range"></span>
        <div class="page-controls">
          <button id="previous-page" class="page-button" type="button" aria-label="上一页" data-i18n-aria-label="上一页" title="上一页" data-i18n-title="上一页">←</button>
          <output id="page-number" aria-live="polite"></output>
          <button id="next-page" class="page-button" type="button" aria-label="下一页" data-i18n-aria-label="下一页" title="下一页" data-i18n-title="下一页">→</button>
        </div>
      </nav>
      <div id="empty-state" class="empty-state" hidden>
        <div class="empty-mark">∅</div>
        <h2 data-i18n="没有匹配的包">没有匹配的包</h2>
        <p data-i18n="尝试减少筛选条件，或者查看 Dashboard 了解当前数据范围。">尝试减少筛选条件，或者查看数据总览了解当前数据范围。</p>
        <a class="button" href="dashboard/" data-i18n="打开 Dashboard">打开数据总览</a>
      </div>
    </main>

    <footer class="footer"><span data-i18n="Agent Forge 只整合元数据，不验证来源、兼容性或安全性。">Agent Forge 只整合元数据，不验证来源、兼容性或安全性。</span><a href="https://github.com/metaone01/agent-forge" target="_blank" rel="noreferrer">GitHub ↗</a></footer>
    <script src="../assets/query-client.js" defer></script>
    <script src="../assets/recommendations-ui.js" defer></script>
    <script src="../assets/source-controls-ui.js" defer></script>
    <script src="../assets/releases-ui.js" defer></script>
    <script src="../assets/api-catalog.js" defer></script>
    <script src="../assets/api-presentation.js" defer></script>
  </body>
</html>
