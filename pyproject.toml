[project]
name = "agent-forge-metadata"
version = "0.1.0"
description = "Agent tool metadata collection, validation, and projection"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.23,<5",
    "referencing>=0.36,<1",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
http = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
http-test = ["httpx==0.28.1"]

[tool.uv]
package = false
exclude-newer = "2026-10-14T10:45:00Z"
