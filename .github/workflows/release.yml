name: Publish Agent Forge catalog revision

on:
  schedule:
    - cron: '0 0,8,16 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: catalog-release
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.value }}
      changed: ${{ steps.changes.outputs.changed }}
      control_sha: ${{ steps.control.outputs.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: packages

      - name: Check out main site control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: control
          persist-credentials: false

      - name: Overlay selected main site docs contracts and tools
        id: control
        shell: bash
        run: |
          # Main owns presentation/contracts; canonical sources remain packages.
          cp -R control/site/. site/
          cp control/README.md control/README_en.md .
          mkdir -p docs/schema
          cp -R control/docs/schema/. docs/schema/
          for schema in package index source advisory; do
            cp "control/${schema}.schema.json" "${schema}.schema.json"
          done
          cp control/tools/build_site.py control/tools/project.py control/tools/validate.py control/tools/identity.py tools/
          echo "sha=$(git -C control rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest-known
          enable-cache: true

      - name: Validate canonical metadata
        run: uv run --with jsonschema --with referencing python tools/validate.py --all

      - name: Calculate UTC revision
        id: revision
        shell: bash
        run: echo "value=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"

      - name: Generate projections with ten-minute cutoff
        run: uv run --with jsonschema --with referencing python tools/project.py --clean --revision "${{ steps.revision.outputs.value }}"

      - name: Detect catalog changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_SHA: ${{ steps.control.outputs.sha }}
        shell: bash
        run: |
          # Generated Pages data is intentionally not committed. Compare the
          # canonical sources and site with the last immutable catalog tag.
          # Dashboard-only changes must also reach the published site.
          last_tag=$(gh release list --limit 20 --json tagName --jq '[.[] | select(.tagName | startswith("catalog-"))][0].tagName' || true)
          last_control=""
          if [ -n "$last_tag" ]; then
            last_control=$(gh release view "$last_tag" --json body --jq .body | sed -n 's/^Control-plane commit: //p' | head -n 1)
          fi
          # A main-only site/tool change must not be suppressed by the packages diff.
          if [ -z "$last_tag" ] || [ "$last_control" != "$CONTROL_SHA" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$last_tag"..HEAD -- sources site; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack static catalog snapshot
        shell: bash
        run: tar -czf "agent-forge-${{ steps.revision.outputs.value }}.tar.gz" -C data .

      - name: Build optional SQLite FTS snapshots
        run: uv run --with jsonschema --with referencing python tools/snapshot.py --data data --output snapshots

      - name: Compress timestamped SQLite assets
        shell: bash
        env:
          REVISION: ${{ steps.revision.outputs.value }}
        run: |
          mkdir -p release-assets
          while IFS= read -r db; do
            relative="${db#snapshots/}"
            agent="${relative%%/*}"
            type="${relative#*/}"
            type="${type%.db}"
            zstd --quiet --force --ultra -19 "$db" -o "release-assets/${agent}-${type}-${REVISION}.db.zst"
          done < <(find snapshots -type f -name '*.db' | sort)

      - name: Assemble GitHub Pages site
        shell: bash
        run: uv run python tools/build_site.py --output pages-staging --data data --root .

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-staging

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalog-release
          path: |
            agent-forge-${{ steps.revision.outputs.value }}.tar.gz
            release-assets/*.db.zst

  release:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download catalog snapshot
        uses: actions/download-artifact@v4
        with:
          name: catalog-release

      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ needs.generate.outputs.revision }}
          CONTROL_SHA: ${{ needs.generate.outputs.control_sha }}
        run: |
          gh release create --repo "${GITHUB_REPOSITORY}" "catalog-${REVISION}" agent-forge-${REVISION}.tar.gz release-assets/*.db.zst \
            --target packages \
            --title "Catalog ${REVISION}" \
            --notes "$(printf 'Generated Agent Forge metadata projection. Metadata is integrated but not source-verified.\n\nControl-plane commit: %s\n' "$CONTROL_SHA")"

  pages:
    needs: generate
    if: needs.generate.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
