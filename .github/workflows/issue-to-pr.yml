name: Convert package issue to Pull Request

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: package-submission-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  proposal:
    if: contains(github.event.issue.labels.*.name, 'package-submission')
    runs-on: ubuntu-latest
    steps:
      - name: Check out main control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: control
          persist-credentials: false

      - name: Check out canonical packages for preflight
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: packages
          path: canonical
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest-known
          enable-cache: true

      - name: Overlay main submission validator and contracts
        shell: bash
        run: |
          # Local runner only: never commit control files into the proposal.
          cp control/tools/validate.py control/tools/identity.py canonical/tools/
          for schema in package index source advisory; do
            cp "control/${schema}.schema.json" "canonical/${schema}.schema.json"
          done

      - name: Parse issue and stage canonical record locally
        id: stage
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { execFileSync } = require('node:child_process');
            const workspace = process.env.GITHUB_WORKSPACE;
            const { parseIssue, prepareRecord, packagePath, TARGET_BRANCH } = require(path.join(workspace, 'control/tools/issue_submission.cjs'));
            if (TARGET_BRANCH !== 'packages') throw new Error('Submission target must be packages.');
            const issue = context.payload.issue;
            const { record: submitted } = parseIssue(issue.body || '');
            const record = prepareRecord(submitted, issue.created_at);
            const relative = packagePath(record);
            const root = path.join(workspace, 'canonical');
            let directory = root;
            // Reject symlinks before descending or creating the next directory.
            for (const component of relative.split('/').slice(0, -1)) {
              directory = path.join(directory, component);
              try { fs.mkdirSync(directory); }
              catch (error) { if (error.code !== 'EEXIST') throw error; }
              const stat = fs.lstatSync(directory);
              if (stat.isSymbolicLink() || !stat.isDirectory()) throw new Error('Canonical package directories must not be symlinks.');
            }
            try {
              fs.writeFileSync(path.join(root, relative), JSON.stringify(record, null, 2) + '\n', { flag: 'wx' });
            } catch (error) {
              if (error.code === 'EEXIST') throw new Error('This package/version path already exists; updates need a reviewed PR, not an overwrite.');
              throw error;
            }
            const baseSha = execFileSync('git', ['-C', root, 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            return { path: relative, baseSha };

      - name: Validate staged canonical JSON and catalog identity
        working-directory: canonical
        env:
          STAGED_SUBMISSION: ${{ steps.stage.outputs.result }}
        shell: bash
        run: |
          record_path=$(node -e 'process.stdout.write(JSON.parse(process.env.STAGED_SUBMISSION).path)')
          # validate.py binds ROOT to its own checkout, not the shell cwd alone.
          uv run --with jsonschema --with referencing python tools/validate.py "$record_path" --submission-formats
          uv run --with jsonschema --with referencing python tools/validate.py --all

      - name: Create short-lived GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AGENT_FORGE_APP_ID }}
          private-key: ${{ secrets.AGENT_FORGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: agent-forge

      - name: Create validated proposal branch and Pull Request
        uses: actions/github-script@v7
        env:
          STAGED_SUBMISSION: ${{ steps.stage.outputs.result }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const workspace = process.env.GITHUB_WORKSPACE;
            const { parseIssue, prepareRecord, packagePath, TARGET_BRANCH } = require(path.join(workspace, 'control/tools/issue_submission.cjs'));
            if (TARGET_BRANCH !== 'packages') throw new Error('Submission target must be packages.');
            const issue = context.payload.issue;
            const { record: submitted, notes } = parseIssue(issue.body || '');
            const record = prepareRecord(submitted, issue.created_at);
            const staged = JSON.parse(process.env.STAGED_SUBMISSION);
            const relative = packagePath(record);
            if (relative !== staged.path || !/^[a-f0-9]{40}$/.test(staged.baseSha)) throw new Error('Invalid staged submission metadata.');
            const payload = fs.readFileSync(path.join(workspace, 'canonical', relative), 'utf8');
            if (JSON.stringify(JSON.parse(payload)) !== JSON.stringify(record)) throw new Error('The staged canonical JSON changed after parsing.');
            const { owner, repo } = context.repo;
            const ref = await github.rest.git.getRef({ owner, repo, ref: 'heads/packages' });
            if (ref.data.object.sha !== staged.baseSha) {
              throw new Error('packages advanced after canonical validation; rerun this workflow against the new base before creating a branch.');
            }
            const branch = `proposal/issue-${issue.number}`;
            await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: staged.baseSha });
            const content = Buffer.from(payload).toString('base64');
            await github.rest.repos.createOrUpdateFileContents({ owner, repo, path: relative, message: `Add metadata proposal from issue #${issue.number}`, content, branch, committer: { name: 'agent-forge-bot', email: '41898282+github-actions[bot]@users.noreply.github.com' }, author: { name: 'agent-forge-bot', email: '41898282+github-actions[bot]@users.noreply.github.com' } });
            await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ['package-submission'] });
            const notesBody = notes ? `\n\nSubmission notes:\n${notes}` : '';
            const pr = await github.rest.pulls.create({ owner, repo, head: branch, base: 'packages', title: `Metadata proposal: ${record.name} ${record.version}`, body: `Closes #${issue.number}\n\nSubmitted by @${issue.user.login}.\n\nThis PR was generated from the package upload form after canonical preflight validation. It will remain open for the ten-minute publication cooldown before entering Merge Queue. Required schema and semantic checks must still pass on the final PR/merge-group commit before merge.${notesBody}`, maintainer_can_modify: false });
            await github.rest.issues.addLabels({ owner, repo, issue_number: pr.data.number, labels: ['package-submission'] });
            await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `Created Pull Request #${pr.data.number} for review: ${pr.data.html_url}` });
