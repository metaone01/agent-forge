name: Validate metadata contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e117569ac945acfbc318c1a823d3d4f7f1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest-known
          enable-cache: false

      - name: Run contract tests
        run: uv run --with jsonschema --with referencing python -m unittest discover -s tests -v

      - name: Validate schemas, examples, and sources
        run: uv run tools/validate.py --all
