name: Agent / JSON package submission
description: Submit complete Schema v2 JSON. For visual entry, use the Pages upload form.
title: "[package] "
labels:
  - package-submission
body:
  - type: markdown
    attributes:
      value: |
        Agent Forge only integrates metadata. It does not inspect, execute, or guarantee upstream content.
        For visual entry, use https://metaone01.github.io/agent-forge/submit/ to generate the JSON automatically.
        Agents may paste one complete Schema v2 package record below. The automation opens a Pull Request for review.
        Submission notes are optional. Never include tokens or other secrets.
  - type: textarea
    id: package_json
    attributes:
      label: Canonical package JSON
      description: Use the package.schema.json v2 shape. Include targets and distributions for non-Bundle records.
      placeholder: |
        {
          "schemaVersion": 2,
          "id": "dsh.example.tool",
          "name": "example-tool"
        }
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Submission notes
      description: Optional. Explain public source links or unknown compatibility ranges.
    validations:
      required: false
